name: Autumn Evans
markdown: kramdown
permalink: /blog/:year/:month/:day/:title

urls:
  - text: Home
    url: /
  - text: About
    url: /about/
  - text: Blog
    url: /blog/

#has to be done this way due to a bug: https://github.com/jekyll/jekyll/issues/1352
include:
  - "_framework"
  - "_bin"

exclude:
  - "site_mockup.xd"
  - "README.md"
  - ".vs"
  - "start.cmd"
  - "run.sh"
  - "Dockerfile"
  - "docker-compose.yml"
  - "conf"
  - "Cache"
  - ".devcontainer"
  - ".github"
  - ".jekyll-cache"
  - ".jekyll-metadata"
  - "vendor"



plugins:
  - jekyll-last-modified-at

title: Autumn Evans' Dev Blog
description: Welcome to my dev blog!
author: Autumn Evans

# Optional. The default date format, used if none is specified in the tag.
last-modified-at:
    date-format: '%d-%b-%y'