    <h3 >Recent Blogs</h3>
    <div class="break"></div>
    {% for post in site.posts limit: 3 %}
    <div class="scard recent-blog">
      <div>
        {% if post.image %}
        <a href="{{ post.url }}" title="{{ post.title }}"><img src="{{post.image}}"></a>
        {% endif %}
      </div>
      <div>
        <h3><a href="{{post.url}}">{{post.title}}</a></h3> 
      </div>
      <div>
        <p>{{ post.date | date_to_string }}</p>
      </div>
      
    </div>
    {% endfor %}
