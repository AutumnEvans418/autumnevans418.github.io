<h2>{{site.data.profile.name}}</h2>
<h3>{{site.data.profile.title}}</h3>
<div class="hstack gap-1 pt-1 pb-1">
    {% for soc in site.data.profile.social %}
        <a href="{{soc.url}}" target="_blank"><img style="width: 25px" alt="{{soc.title}}" src="{{soc.image}}"></a>
    {% endfor %}
</div>
<div>
    {{site.data.profile.summary}}
</div>
<div>
    <a href="{{site.data.profile.resumeUrl}}" target="_blank" class="btn">View Resume</a>
</div>
